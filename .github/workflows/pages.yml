# Builds the standalone PWA (docs/PWA_STANDALONE.md) and publishes it to GitHub Pages:
# https://danialsafarli.github.io/opengym-pwa/
#
# This fork replaces upstream's demo deployment (VITE_DEMO=1, seeded example data) with the
# standalone build (`npm run build:pwa`: VITE_STANDALONE_WEB=1 from frontend/.env.pwa) — your own
# data, kept in the browser, no backend. Nothing built is committed: dist/ exists only inside the
# job and goes to Pages as an artifact.
#
# Pages serves static files only, which is all this build needs. The app routes behind the hash and
# its assets are relative (vite `base: './'`), so the /opengym-pwa/ subpath needs no configuration
# and a reload on any screen cannot 404.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

# One deployment at a time; a newer push waits rather than cancelling one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Node 22, as upstream's CI and Dockerfiles use.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # A failing test stops the deployment: the site keeps the last build that passed.
      - run: npm test
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      - run: npm run build:pwa
        working-directory: frontend
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the artifact
      id-token: write   # prove to Pages that this workflow run is the one publishing
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
